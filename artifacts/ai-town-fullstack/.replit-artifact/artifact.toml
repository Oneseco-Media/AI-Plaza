kind = "web"
previewPath = "/ai-town-fullstack/"
title = "AI Town Fullstack"
version = "1.0.0"
id = "artifacts/ai-town-fullstack"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/ai-town-fullstack/" ]
localPort = 20044

[services.development]
run = "pnpm --filter @workspace/ai-town-fullstack run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ai-town-fullstack", "run", "build" ]
run = "pnpm --filter @workspace/ai-town-fullstack run serve"

[services.env]
PORT = "20044"
BASE_PATH = "/ai-town-fullstack/"
