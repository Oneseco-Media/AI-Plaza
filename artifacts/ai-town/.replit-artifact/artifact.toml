kind = "web"
previewPath = "/"
title = "AI Town"
version = "1.0.0"
id = "artifacts/ai-town"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18101

[services.development]
run = "pnpm --filter @workspace/ai-town run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ai-town", "run", "build" ]
publicDir = "artifacts/ai-town/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18101"
BASE_PATH = "/"
